name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-node: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Project
        # This injects the GitHub keys into your project environment variables during the build process
        env:
          REACT_APP_PRIVATE_KEY: ${{ secrets.API_KEY }}
          REACT_APP_PUBLIC_KEY: ${{ vars.API_KEY2 }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # The folder your build script generates
